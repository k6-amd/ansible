---
- name: Load administrator credentials
  ansible.builtin.include_vars:
    file: publickeytoto.yml

- name: Validate administrator password hash
  ansible.builtin.assert:
    that:
      - vault_admin_password_hash is defined
      - vault_admin_password_hash | length > 0
    fail_msg: "Define vault_admin_password_hash in the encrypted administrator variables."
  no_log: true

- name: Create administrator account
  ansible.builtin.user:
    name: "{{ admin_username }}"
    shell: /bin/bash
    append: true
    password: "{{ vault_admin_password_hash }}"
    password_lock: false
    update_password: always
    state: present
  no_log: true
- name: Configure administrator sudo access
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ admin_username }}"
    line: "{{ admin_username }} ALL=(ALL) ALL"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"

- name: Install administrator SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_username }}"
    state: present
    key: "{{ vault_admin_ssh_public_key }}"
