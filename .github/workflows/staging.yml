name: chtulhu
on:
  push:
    branches: [ devellop ] 
jobs:
  ansible:
    name: run playbook
    runs-on: [self-hosted, yig]
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7
      - name: Injecter le mot de passe Ansible Vault
        working-directory: ${{ github.workspace }}
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -z "$ANSIBLE_VAULT_PASSWORD" ]; then
            echo "::error::Le secret GitHub ANSIBLE_VAULT_PASSWORD est requis."
            exit 1
          fi
          chmod 600 inventory/staging/group_vars/vault.yml
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > inventory/staging/group_vars/vault.yml
      - name: Install Ansible collections
        working-directory: ${{ github.workspace }}
        run: ansible-galaxy collection install -r requirements.yml
      - name: run ansible-playbook
        working-directory: ${{ github.workspace }}
        run: |
          ansible-playbook main.yml