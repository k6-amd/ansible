name: chtulhu
on:
  push:
    branches: [ devellop ] 
jobs:
  ansible:
    name: run playbook
    runs-on: [self-hosted, yig]
    steps:
      # Checkout : récupère le projet à jour depuis le dépôt : comme un git clone | pull
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: injection des vaults
        working-directory: ${{ github.workspace }}
        run: |
          cp /home/ansible/test/.vault /home/ansible/test/test/test/.vault
      - name: run ansible-playbook
        working-directory: ${{ github.workspace }}
        run: |
          ansible-playbook main.yml